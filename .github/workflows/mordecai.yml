name: Mordecai CI and Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mordecai-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check web/engine.js
      - run: node --check web/ai.js
      - run: |
          node --check web/app.js
          node --check web/magician.js
          node --check web/cat-lady.js
          node --check web/rockstar.js
      - run: |
          node --check web/reckless.js
          node --check web/stonewall.js
          node --check builder/app.js
          node builder/smoke.mjs
      - run: |
          node --check lab/gambling-dad/builder/app.js
          node lab/gambling-dad/builder/smoke.mjs
      - run: node --check poll/app.js
      - run: node --check poll/questions.js
      - run: node poll/test.mjs
      - name: Verify browser module imports
        run: |
          grep -q "from './engine.js" web/app.js
          grep -q "from './ai.js" web/app.js
          test -f web/engine.js
          test -f web/ai.js
      - run: node web/smoke.mjs
      - run: node web/reckless.test.mjs
      - run: node web/stonewall.test.mjs
      - run: node web/magician.test.mjs
      - name: Verify builder and every Misdirection Action in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 > /tmp/unhinged-http.log 2>&1 &
          node web/browser.test.mjs
      # Historical labs remain runnable research fixtures but do not gate Mordecai production.
      # Mordecai production simulation is intentionally held until engine parity.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/web _site/builder _site/poll
          cp poll/index.html poll/app.js poll/questions.js poll/config.js poll/style.css _site/poll/
          mkdir -p _site/lab/leader-rulebreakers/crazy-cat-lady _site/lab/leader-rulebreakers/mad-scientist
          cp index.html CARDS.json DECKS.json _site/
          cp web/*.html web/*.js web/*.css _site/web/
          cp builder/index.html builder/app.js builder/style.css builder/smoke.mjs _site/builder/
          cp lab/leader-rulebreakers/crazy-cat-lady/CARDS.json lab/leader-rulebreakers/crazy-cat-lady/DECK.json _site/lab/leader-rulebreakers/crazy-cat-lady/
          cp lab/leader-rulebreakers/mad-scientist/CARDS.json lab/leader-rulebreakers/mad-scientist/DECK.json lab/leader-rulebreakers/mad-scientist/TOKENS.json _site/lab/leader-rulebreakers/mad-scientist/
          cp -R lab/gambling-dad _site/lab/
          cp -R lab/playtest _site/lab/
          cp -R lab/composure _site/lab/
          mkdir -p _site/lab/board-width
          cp lab/board-width/index.html lab/board-width/style.css lab/board-width/app.mjs lab/board-width/engine.mjs lab/board-width/ai.mjs lab/board-width/selection.mjs lab/board-width/CARDS.json lab/board-width/DECKS.json _site/lab/board-width/
          mkdir -p _site/lab/schemes
          cp lab/schemes/index.html lab/schemes/style.css lab/schemes/app.mjs lab/schemes/engine.mjs lab/schemes/ai.mjs lab/schemes/CARDS.json lab/schemes/DECKS.json _site/lab/schemes/
          test -f _site/lab/gambling-dad/index.html
          test -f _site/lab/gambling-dad/app.js
          test -f _site/lab/gambling-dad/poker.mjs
          test -f _site/lab/gambling-dad/builder/index.html
          test -f _site/lab/gambling-dad/builder/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
