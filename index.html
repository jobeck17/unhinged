<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNHINGED • Mongo</title><style>body{margin:0;background:#0b0d10;color:#f4f6f8;font:16px system-ui;padding:24px}.w{max-width:900px;margin:auto}.tag{color:#ff6b35;font-weight:800}.p{background:#15191e;border:1px solid #36404b;border-radius:16px;padding:18px;margin:16px 0}button,select{background:#11161b;color:#fff;border:1px solid #46515d;border-radius:10px;padding:12px;margin:4px}.cards{display:flex;gap:8px;overflow:auto}.c{min-width:130px;background:#20262d;border-radius:10px;padding:10px}.n{font-weight:800}.s{font-size:22px;font-weight:900}.m{color:#9ca7b3;font-size:12px}</style></head><body><div class=w><h1>UNHINGED</h1><div class=tag>MONGO • PRE-COMMIT PLAYTEST</div><div class=p><select id=d></select><select id=e></select><button id=n>NEW GAME</button></div><div class=p><b id=st></b><p id=hp></p></div><div class=p><h3>Opponent Battlefield</h3><div class=cards id=ob></div></div><div class=p><h3>Your Battlefield</h3><div class=cards id=yb></div></div><div class=p><h3>Your Hand</h3><div class=cards id=h></div><p><button id=play>PLAY FIRST AFFORDABLE</button><button id=atk>ATTACK</button><button id=end>END ROUND</button></p></div><div class=p><div id=log class=m></div></div></div><script>(()=>{const pools=['Aggro','Midrange','Control','Tempo','Kamikaze'],hp={Aggro:18,Midrange:22,Control:24,Tempo:21,Kamikaze:20},names={Aggro:'War Chief',Midrange:'Field Marshal',Control:'Bastion',Tempo:'Tactician',Kamikaze:'Martyr King'},units={Aggro:[['Parking Lot Brawler',1,2,1],['Florida Man',2,3,2],['Bottle Rocket Kid',3,4,2],['Gas Station Gladiator',4,5,3],['Pickup Bed Berserker',5,6,4]],Midrange:[['Little League Coach',1,1,2],['Neighborhood Dad',2,2,3],['General Contractor',3,3,4],['Weekend Warrior',4,4,5],['Suburban Legend',5,5,6]],Control:[['Coupon Lady',1,1,2],['HOA Enforcer',2,1,4],['Mall Cop',3,2,5],['Code Inspector',4,3,6],['Grumpy Old Guy',5,4,7]],Tempo:[['Hacky Sack Guy',1,1,2],['Influencer',2,2,2],['Hacker',3,3,3],['Feral Child',4,4,4],['Chaos Coordinator',5,5,5]],Kamikaze:[['Bomb Rat',1,1,1],['Martyr',1,1,1],['Powder Keg',2,2,2],['Torchbearer',3,3,2],['Doom Beast',5,6,3]]};let S;const $=x=>document.getElementById(x);function deck(p){let a=[];for(let i=0;i<26;i++)a.push([...units[p][i%5],'Unit']);for(let i=0;i<8;i++)a.push([i<6?'Tactical Action':'SWING Action',i<6?2:5,0,0,'Action']);for(let i=0;i<6;i++)a.push(['Attached Item',1,0,0,'Item']);return a.sort(()=>Math.random()-.5)}function side(p){let x={p,hp:hp[p],cmd:1,max:1,deck:deck(p),hand:[],board:[],discard:[]};for(let i=0;i<7;i++)x.hand.push(x.deck.pop());return x}function start(){S={r:1,p:side($('d').value),e:side($('e').value),log:[]};render()}function card(c){return '<div class=c><div class=m>'+c[4]+' • '+c[1]+' CMD</div><div class=n>'+c[0]+'</div>'+(c[4]=='Unit'?'<div class=s>'+c[2]+'/'+c[3]+'</div>':'')+'</div>'}function render(){$('st').textContent='ROUND '+S.r+' • '+names[S.p.p]+' vs '+names[S.e.p];$('hp').textContent='You ♥ '+S.p.hp+' | Command '+S.p.cmd+'/'+S.p.max+'    Opponent ♥ '+S.e.hp;$('h').innerHTML=S.p.hand.map(card).join('');$('yb').innerHTML=S.p.board.map(x=>card(x.c)).join('');$('ob').innerHTML=S.e.board.map(x=>card(x.c)).join('');$('log').innerHTML=S.log.slice(-12).join('<br>')}function play(x){let i=x.hand.findIndex(c=>c[1]<=x.cmd);if(i<0)return;let c=x.hand.splice(i,1)[0];x.cmd-=c[1];if(c[4]=='Unit')x.board.push({c,ready:false,dmg:0});else x.discard.push(c);S.log.push((x==S.p?'You':'Opponent')+' played '+c[0])}function attack(me,foe){let a=me.board.find(x=>x.ready);if(!a)return; a.ready=false;let b=foe.board.find(x=>x.ready);if(!b){foe.hp-=a.c[2];S.log.push(a.c[0]+' hit Leader for '+a.c[2]);return}let power=a.c[2],need=b.c[3]-b.dmg,hit=Math.min(power,need);b.dmg+=hit;let overflow=power-hit;if(b.dmg>=b.c[3]){foe.board.splice(foe.board.indexOf(b),1);foe.discard.push(b.c)}else{a.dmg+=b.c[2];if(a.dmg>=a.c[3]){me.board.splice(me.board.indexOf(a),1);me.discard.push(a.c)}}if(overflow>0)foe.hp-=overflow;S.log.push('Combat resolves; only surviving blocker retaliates.')}function ai(){play(S.e);attack(S.e,S.p);render()}function end(){S.r++;for(const x of [S.p,S.e]){x.max=Math.min(6,x.max+1);x.cmd=x.max;x.board.forEach(u=>u.ready=true);if(x.deck.length)x.hand.push(x.deck.pop())}S.log.push('Round '+S.r+' begins');render()}pools.forEach(p=>{$('d').add(new Option(p,p));$('e').add(new Option(p,p))});$('e').selectedIndex=2;$('n').onclick=start;$('play').onclick=()=>{play(S.p);ai();render()};$('atk').onclick=()=>{attack(S.p,S.e);ai();render()};$('end').onclick=end;start()})()</script></body></html>
