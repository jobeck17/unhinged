<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10">
<title>UNHINGED • Mongo</title>
<style>
:root{--bg:#0b0d10;--panel:#15191e;--card:#20262d;--line:#36404b;--text:#f4f6f8;--muted:#9ca7b3;--hot:#ff6b35;--ok:#68d391;--target:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.w{max-width:980px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:24px;margin:0;letter-spacing:.08em}.tag{color:var(--hot);font-size:11px;font-weight:850}.p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.setup{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}button,select{min-height:44px;background:#11161b;color:#fff;border:1px solid #46515d;border-radius:10px;padding:9px;font:inherit;font-weight:700}button:disabled{opacity:.35}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}.leader{padding:8px;border-radius:10px;background:#101419}.leader.enemy{text-align:right}.playerHud{position:sticky;bottom:92px;z-index:4;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#101419ee;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:9px;margin:7px 0}.playerHud .hp{font-size:20px}.resources{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.res{background:#1b2229;border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800}.flash{animation:hitflash .65s ease}.float{position:absolute;z-index:9;left:50%;top:42%;transform:translate(-50%,-50%);font-size:26px;font-weight:950;color:#ff8f8f;text-shadow:0 2px 8px #000;pointer-events:none;animation:floatup .9s ease forwards}.c{overflow:visible}@keyframes hitflash{0%,100%{box-shadow:none}35%{box-shadow:0 0 0 4px #ff6b3566;background:#43241f}}@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-42px) scale(1.15)}}.leader.target{outline:3px solid var(--target);cursor:pointer}.hp{font-size:24px;font-weight:950}.m{color:var(--muted);font-size:11px}.zoneTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.cards{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 7px}.c{position:relative;min-width:128px;width:128px;min-height:126px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px;scroll-snap-align:start;user-select:none}.c.selectable{cursor:pointer}.c.selected{outline:3px solid var(--hot);transform:translateY(-2px)}.c.target{outline:3px solid var(--target);cursor:pointer;animation:pulse 1.1s infinite alternate}.c.exhausted{opacity:.55}.n{font-weight:850;line-height:1.1}.s{font-size:21px;font-weight:950;margin-top:8px}.damage{color:#ff8f8f;font-size:11px}.actions{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 18%);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{margin:0}.primary{background:var(--hot);color:#111;border-color:var(--hot)}.hint{background:#11161b;border-left:3px solid var(--hot);border-radius:8px;padding:9px;margin:8px 0;font-size:12px}.log{max-height:120px;overflow:auto;line-height:1.5}.badge{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:3px 7px;color:var(--muted)}
@keyframes pulse{to{box-shadow:0 0 0 4px #ffd16633}}@media(min-width:720px){.w{padding:20px}.actions{grid-template-columns:repeat(4,1fr);position:static;background:none;padding:0}.c{min-width:145px;width:145px}.setup{grid-template-columns:1fr 1fr auto}.status{grid-template-columns:1fr 1fr}}@media(max-width:430px){.w{padding:8px}.p{padding:9px;margin:7px 0}.setup{grid-template-columns:1fr 1fr}.setup button{grid-column:1/-1}.c{min-width:118px;width:118px;min-height:116px}.top h1{font-size:21px}}
</style></head><body><div class="w">
<div class="top"><div><h1>UNHINGED</h1><div class="tag">MONGO • GUIDED PLAYTEST</div></div><span class="badge" id="phase">YOUR ACTION</span></div>
<div class="p setup"><select id="d" aria-label="Your deck"></select><select id="e" aria-label="Opponent deck"></select><button id="n">New Game</button></div>
<div class="p status"><div class="leader" id="you"><b id="yn"></b><div class="hp">♥ <span id="yhp"></span></div><div class="m" id="yr"></div></div><div class="leader enemy" id="enemyLeader"><b id="en"></b><div class="hp"><span id="ehp"></span> ♥</div><div class="m" id="er"></div></div></div>
<div class="hint" id="hint">Select a card in your hand to play it, or select a ready Unit to attack.</div>
<div class="p"><div class="zoneTitle"><b>Opponent Battlefield</b><span class="m" id="oc"></span></div><div class="cards" id="ob"></div></div>
<div class="playerHud" id="playerHud"><div><b id="hudName"></b><div class="hp">♥ <span id="hudHp"></span></div></div><div class="resources"><span class="res">CMD <span id="hudCmd"></span></span><span class="res">STA <span id="hudSta">3/3</span></span><span class="res">HAND <span id="hudHand"></span></span></div></div><div class="p"><div class="zoneTitle"><b>Your Battlefield</b><span class="m" id="yc"></span></div><div class="cards" id="yb"></div></div>
<div class="p"><div class="zoneTitle"><b>Your Hand</b><span class="m" id="hc"></span></div><div class="cards" id="h"></div></div>
<div class="actions"><button id="play" class="primary">Play Selected</button><button id="attack">Attack</button><button id="cancel">Cancel</button><button id="end">End Round</button></div>
<div class="p"><b>Match Log</b><div id="log" class="m log"></div></div>
</div>
<script>
(()=>{const pools=['Aggro','Midrange','Control','Tempo','Kamikaze'],H={Aggro:18,Midrange:22,Control:24,Tempo:21,Kamikaze:20},N={Aggro:'War Chief',Midrange:'Field Marshal',Control:'Bastion',Tempo:'Tactician',Kamikaze:'Martyr King'},U={Aggro:[['Parking Lot Brawler',1,2,1],['Florida Man',2,3,2],['Bottle Rocket Kid',3,4,2],['Gas Station Gladiator',4,5,3],['Pickup Bed Berserker',5,6,4]],Midrange:[['Little League Coach',1,1,2],['Neighborhood Dad',2,2,3],['General Contractor',3,3,4],['Weekend Warrior',4,4,5],['Suburban Legend',5,5,6]],Control:[['Coupon Lady',1,1,2],['HOA Enforcer',2,1,4],['Mall Cop',3,2,5],['Code Inspector',4,3,6],['Grumpy Old Guy',5,4,7]],Tempo:[['Hacky Sack Guy',1,1,2],['Influencer',2,2,2],['Hacker',3,3,3],['Feral Child',4,4,4],['Chaos Coordinator',5,5,5]],Kamikaze:[['Bomb Rat',1,1,1],['Martyr',1,1,1],['Powder Keg',2,2,2],['Torchbearer',3,3,2],['Doom Beast',5,6,3]]};
let S,sel=null,mode='idle',fx=[];const $=x=>document.getElementById(x);function deck(p){let a=[];for(let i=0;i<26;i++)a.push([...U[p][i%5],'Unit']);for(let i=0;i<8;i++)a.push([i<6?'Tactical Action':'SWING Action',i<6?2:5,0,0,'Action']);for(let i=0;i<6;i++)a.push(['Attached Item',1,0,0,'Item']);return a.sort(()=>Math.random()-.5)}function side(p){let x={p,hp:H[p],cmd:1,max:1,deck:deck(p),hand:[],board:[],discard:[]};for(let i=0;i<7;i++)x.hand.push(x.deck.pop());return x}function note(x){S.log.push('R'+S.r+' • '+x)}function effect(zone,i,amount){fx.push({zone,i,amount});setTimeout(()=>{fx.shift();render()},850)}function flashMe(){let x=$('playerHud');x.classList.remove('flash');void x.offsetWidth;x.classList.add('flash');setTimeout(()=>x.classList.remove('flash'),650)}function hint(x){$('hint').textContent=x}function start(){S={r:1,p:side($('d').value),e:side($('e').value),log:[],over:false};sel=null;mode='idle';note('Game begins. Units enter exhausted.');render();hint('Select a card in your hand to play it, or select a ready Unit to attack.')}
function chtml(c,i,zone,obj){let unit=c[4]=='Unit',ready=obj?obj.ready:false,cl='c selectable';if(zone=='yb'&&!ready)cl+=' exhausted';if(sel&&sel.zone==zone&&sel.i==i)cl+=' selected';if(mode=='target'&&zone=='ob')cl+=' target';let f=fx.find(x=>x.zone==zone&&x.i==i);return '<div class="'+cl+'" data-zone="'+zone+'" data-i="'+i+'">'+(f?'<span class=float>'+f.amount+'</span>':'')<div class=m>'+c[4]+' • '+c[1]+' CMD</div><div class=n>'+c[0]+'</div>'+(unit?'<div class=s>'+c[2]+'/'+c[3]+'</div>':'')+(obj&&obj.dmg?'<div class=damage>'+obj.dmg+' damage</div>':'')+'</div>'}
function render(){$('yn').textContent=N[S.p.p];$('hudName').textContent=N[S.p.p];$('hudHp').textContent=S.p.hp;$('hudCmd').textContent=S.p.cmd+'/'+S.p.max;$('hudHand').textContent=S.p.hand.length;$('en').textContent=N[S.e.p];$('yhp').textContent=S.p.hp;$('ehp').textContent=S.e.hp;$('yr').textContent='Command '+S.p.cmd+'/'+S.p.max;$('er').textContent='Round '+S.r;$('phase').textContent=mode=='target'?'CHOOSE TARGET':'YOUR ACTION';$('h').innerHTML=S.p.hand.map((c,i)=>chtml(c,i,'h')).join('');$('yb').innerHTML=S.p.board.map((x,i)=>chtml(x.c,i,'yb',x)).join('');$('ob').innerHTML=S.e.board.map((x,i)=>chtml(x.c,i,'ob',x)).join('');$('hc').textContent=S.p.hand.length+' cards';$('yc').textContent=S.p.board.length+' Units';$('oc').textContent=S.e.board.length+' Units';$('log').innerHTML=S.log.slice(-14).join('<br>');$('enemyLeader').classList.toggle('target',mode=='target');$('play').disabled=!(sel&&sel.zone=='h'&&S.p.hand[sel.i]&&S.p.hand[sel.i][1]<=S.p.cmd);$('attack').disabled=!(sel&&sel.zone=='yb'&&S.p.board[sel.i]&&S.p.board[sel.i].ready);$('cancel').disabled=!sel&&mode=='idle';document.querySelectorAll('.c').forEach(el=>el.onclick=()=>pick(el.dataset.zone,+el.dataset.i));$('enemyLeader').onclick=()=>{if(mode=='target')resolveAttack(null)}}
function pick(z,i){if(S.over)return;if(mode=='target'){if(z=='ob')resolveAttack(i);return}if(z=='h'){sel={zone:z,i};let c=S.p.hand[i];hint(c[1]<=S.p.cmd?'Selected '+c[0]+'. Tap Play Selected.':'That costs '+c[1]+' Command. You only have '+S.p.cmd+'.');render();return}if(z=='yb'){let u=S.p.board[i];sel={zone:z,i};hint(u.ready?'Selected '+u.c[0]+'. Tap Attack to see legal targets.':u.c[0]+' is exhausted and cannot attack.');render();return}hint('Opponent cards are not selectable until an effect or attack asks you to choose them.')}
function playSelected(){if(!sel||sel.zone!='h')return;let c=S.p.hand[sel.i];if(!c||c[1]>S.p.cmd)return;S.p.cmd-=c[1];S.p.hand.splice(sel.i,1);if(c[4]=='Unit'){S.p.board.push({c,ready:false,dmg:0});note('You deploy '+c[0]+'. It enters exhausted.')}else if(c[4]=='Item'){if(!S.p.board.length){S.p.hand.splice(sel.i,0,c);S.p.cmd+=c[1];hint('Items need a Unit to attach to. Play a Unit first.');sel=null;render();return}S.p.discard.push(c);note('Prototype Item resolves. Item targeting is still being expanded.')}else{S.p.discard.push(c);note('You play '+c[0]+'.')}sel=null;render();ai()}
function beginAttack(){if(!sel||sel.zone!='yb')return;let u=S.p.board[sel.i];if(!u||!u.ready)return;mode='target';hint('Choose a highlighted enemy Unit or the highlighted enemy Leader. The defender may block attacks to the Leader.');render()}
function resolveAttack(t){let a=S.p.board[sel.i];if(!a||!a.ready){mode='idle';sel=null;render();return}a.ready=false;if(t===null){let blockers=S.e.board.filter(x=>x.ready).slice(0,2);if(blockers.length){combat(a,S.p,S.e,blockers,true)}else{S.e.hp-=a.c[2];note(a.c[0]+' hits the Leader for '+a.c[2]+'.')}}else{let b=S.e.board[t];if(b)combat(a,S.p,S.e,[b],false)}mode='idle';sel=null;checkWin();render();if(!S.over)ai()}
function combat(a,me,foe,blocks,toLeader){let dmg=a.c[2],sur=[];for(const b of blocks){let need=b.c[3]-b.dmg,hit=Math.min(dmg,need);b.dmg+=hit;dmg-=hit;if(b.dmg<b.c[3])sur.push(b);if(dmg<=0)break}foe.board.slice().forEach(b=>{if(b.dmg>=b.c[3]){foe.board.splice(foe.board.indexOf(b),1);foe.discard.push(b.c)}});let ret=sur.reduce((n,b)=>n+b.c[2],0);a.dmg+=ret;if(a.dmg>=a.c[3]){me.board.splice(me.board.indexOf(a),1);me.discard.push(a.c)}if(toLeader&&dmg>0)foe.hp-=dmg;note(a.c[0]+' attacks. '+sur.length+' blocker(s) survive and retaliate for '+ret+(toLeader&&dmg>0?'; '+dmg+' Overflow reaches Leader.':'.'))}
function ai(){if(S.over)return;let i=S.e.hand.findIndex(c=>c[1]<=S.e.cmd);if(i>=0){let c=S.e.hand.splice(i,1)[0];S.e.cmd-=c[1];if(c[4]=='Unit'){S.e.board.push({c,ready:false,dmg:0});note('Opponent deploys '+c[0]+'.')}else S.e.discard.push(c)}else{let a=S.e.board.find(x=>x.ready);if(a){a.ready=false;let b=S.p.board.find(x=>x.ready);if(b){let bi=S.p.board.indexOf(b),before=b.dmg;combat(a,S.e,S.p,[b],false);effect('yb',bi,'-'+Math.min(a.c[2],Math.max(0,b.c[3]-before)));}else{S.p.hp-=a.c[2];flashMe();note('Opponent hits your Leader for '+a.c[2]+'.')}}}checkWin();render()}
function endRound(){if(S.over)return;S.r++;for(const x of [S.p,S.e]){x.max=Math.min(6,x.max+1);x.cmd=x.max;x.board.forEach(u=>u.ready=true);if(x.deck.length)x.hand.push(x.deck.pop())}sel=null;mode='idle';note('Round '+S.r+' begins. Units ready and each player draws.');hint('New round. Select a card to play or a ready Unit to attack.');render()}
function checkWin(){if(S.p.hp<=0||S.e.hp<=0){S.over=true;hint(S.p.hp<=0?'Opponent wins. Start a New Game to play again.':'You win! Start a New Game to play again.');$('phase').textContent='GAME OVER'}}
function cancel(){sel=null;mode='idle';hint('Selection cleared. Choose a card or ready Unit.');render()}
pools.forEach(p=>{$('d').add(new Option('You: '+p,p));$('e').add(new Option('Opponent: '+p,p))});$('e').selectedIndex=2;$('n').onclick=start;$('play').onclick=playSelected;$('attack').onclick=beginAttack;$('cancel').onclick=cancel;$('end').onclick=endRound;start()})();
</script></body></html>
