<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14191c">
<title>Unhinged · Carl 0.3</title>
<link rel="stylesheet" href="style.css?v=carl-13-3">
<style>
  #boot-status{padding:32px 20px;max-width:650px;margin:auto;color:#e9ece8;font:600 16px/1.5 system-ui,-apple-system,sans-serif}
  #boot-status small{display:block;color:#9eafb0;margin-top:8px;font-weight:500}
</style>
</head>
<body>
<div id="app"><div id="boot-status">Loading Unhinged · Carl 0.3…<small>Revision 13.3</small></div></div>
<script>
window.addEventListener('error',function(e){
  var a=document.getElementById('app');
  if(a) a.innerHTML='<div id="boot-status"><b>Carl hit a browser error.</b><small>'+String(e.message||'Unknown error')+'</small></div>';
});
window.addEventListener('unhandledrejection',function(e){
  var a=document.getElementById('app');
  var m=e.reason&&e.reason.message?e.reason.message:String(e.reason||'Unknown module error');
  if(a) a.innerHTML='<div id="boot-status"><b>Carl hit a module error.</b><small>'+m+'</small></div>';
});
</script>
<script type="module" src="app.js?v=bath-salts-1"></script>
</body>
</html>
